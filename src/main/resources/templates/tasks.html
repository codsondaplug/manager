<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Задачи</title>
</head>
<body>
<h1>Task Manager</h1>
<p>Пользователь: <b th:text="${email}"></b></p>
<form method="post" th:action="@{/logout}">
    <button type="submit">Выйти</button>
</form>
<p th:if="${message}" th:text="${message}"></p>

<h2>Создать задачу</h2>
<form method="post" th:action="@{/web/tasks}">
    <p><label>Название: <input type="text" name="title" maxlength="255" required></label></p>
    <p><label>Описание: <textarea name="description" maxlength="2000"></textarea></label></p>
    <p><label>Приоритет:
        <select name="priority">
            <option th:each="priority : ${priorities}" th:value="${priority}" th:text="${priority}"></option>
        </select>
    </label></p>
    <button type="submit">Добавить</button>
</form>

<h2>Список задач</h2>
<p th:if="${#lists.isEmpty(tasks)}">Задач пока нет</p>
<table border="1">
    <thead>
    <tr><th>ID</th><th>Название</th><th>Описание</th><th>Приоритет</th><th>Статус</th><th>Владелец</th><th>Действия</th></tr>
    </thead>
    <tbody>
    <tr th:each="task : ${tasks}">
        <td th:text="${task.id}"></td>
        <td th:text="${task.title}"></td>
        <td th:text="${task.description}"></td>
        <td th:text="${task.priority}"></td>
        <td th:text="${task.status}"></td>
        <td th:text="${task.ownerEmail}"></td>
        <td>
            <form method="post" th:action="@{/web/tasks/{id}/status(id=${task.id})}">
                <select name="status">
                    <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == task.status}"></option>
                </select>
                <button type="submit">Изменить статус</button>
            </form>
            <form method="post" th:action="@{/web/tasks/{id}/delete(id=${task.id})}">
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<section th:if="${admin}">
    <h2>Журнал аудита (только ADMIN)</h2>
    <p th:if="${#lists.isEmpty(auditLogs)}">Записей пока нет</p>
    <table border="1">
        <thead><tr><th>Дата</th><th>Пользователь</th><th>Действие</th><th>ID задачи</th><th>Детали</th></tr></thead>
        <tbody>
        <tr th:each="entry : ${auditLogs}">
            <td th:text="${entry.createdAt}"></td>
            <td th:text="${entry.actorEmail}"></td>
            <td th:text="${entry.action}"></td>
            <td th:text="${entry.taskId}"></td>
            <td th:text="${entry.details}"></td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
